# Gate of record for EdgeVector/routines: GitHub (moved from LastGit on 2026-09-30).
# Branch protection on main requires the job named `ci-required`.
#
# `gate` runs .lastgit/ci.sh on macOS: shell syntax, the prompt lint, a per-file
# `bun build`, and `bunx tsc --noEmit`. The repo has no tests (deleted 2026-10-09).
#
# `Registry commit identity` checks the commit author after a push to main.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-required-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "gate=$GATE_RESULT"
          test "$GATE_RESULT" = "success"

  registry-commit:
    name: Registry commit identity
    needs: [ci-required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/registry-commit.py
