name: Routines schema values and latency
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      schema_environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: routines-fleet-values-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_BEFORE: ${{ github.event.pull_request.base.sha || 'abe1ef3e833f0efc97579a8e8b26a17f2923bd5d' }}
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DAEMON: 69315d6201dc968207b6b2fbeca01eba58c8d0d5
  ROUTINES_SCHEMA_ENV: ${{ inputs.schema_environment || 'dev' }}
jobs:
  compare:
    name: Actual fleet commands and latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_AFTER }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BEFORE }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EdgeVector/lastdb
          ref: ${{ env.DAEMON }}
          path: engine
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Pin the source revisions
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$APP_AFTER"
          test "$(git -C control rev-parse HEAD)" = "$APP_BEFORE"
          test "$(git -C engine rev-parse HEAD)" = "$DAEMON"
          mkdir -p "$RUNNER_TEMP/routines-results/source"
          printf 'Candidate %s\nControl base %s\nEngine %s\n' \
            "$APP_AFTER" "$APP_BEFORE" "$DAEMON" > "$RUNNER_TEMP/routines-results/source/revisions.txt"
      - name: Typecheck the actual app and base control before definition admission
        run: |
          set -euo pipefail
          for label in control candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun install --frozen-lockfile
            bunx tsc --noEmit
          done
      - name: Require the real PROD definitions before any build
        if: ${{ env.ROUTINES_SCHEMA_ENV == 'prod' }}
        run: |
          bun candidate/scripts/fleet-schema-definitions.mjs "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/engine" "$RUNNER_TEMP/routines-results/source/definitions.json"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
          shared-key: routines-fleet-values
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Build the exact engine and actual app commands
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/routines-binaries"
          cd "$GITHUB_WORKSPACE/engine"
          FOLDDB_BUILD_VERSION_OVERRIDE="bench-$DAEMON" cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
          cp target/dev-release/lastdbd "$RUNNER_TEMP/routines-binaries/daemon"
          for label in control candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun build src/cli.ts --compile --outfile "$RUNNER_TEMP/routines-binaries/$label"
          done
          cd "$RUNNER_TEMP/routines-binaries"
          sha256sum daemon control candidate > "$RUNNER_TEMP/routines-results/source/programs.sha256"
      - name: Use normal DEV app setup under one generated CI identity
        if: ${{ env.ROUTINES_SCHEMA_ENV == 'dev' }}
        run: |
          python3 candidate/scripts/fleet-status-latency.py --register-definitions-only --schema-environment dev \
            --candidate "$GITHUB_WORKSPACE/candidate" --candidate-revision "$APP_AFTER" --control-revision "$APP_BEFORE" \
            --control-binary "$RUNNER_TEMP/routines-binaries/control" --candidate-binary "$RUNNER_TEMP/routines-binaries/candidate" \
            --daemon "$RUNNER_TEMP/routines-binaries/daemon" --daemon-revision "$DAEMON" \
            --lastdb-source "$GITHUB_WORKSPACE/engine" --output "$RUNNER_TEMP/routines-results/registration"
      - name: Verify all six exact published definitions after normal DEV setup
        if: ${{ env.ROUTINES_SCHEMA_ENV == 'dev' }}
        run: |
          bun candidate/scripts/fleet-schema-definitions.mjs "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/engine" "$RUNNER_TEMP/routines-results/source/definitions.json"
      - name: Compare actual commands in balanced orders from fresh owned-schema homes
        id: operations
        run: |
          python3 candidate/scripts/fleet-status-latency.py --schema-environment "$ROUTINES_SCHEMA_ENV" \
            --candidate "$GITHUB_WORKSPACE/candidate" --candidate-revision "$APP_AFTER" --control-revision "$APP_BEFORE" \
            --control-binary "$RUNNER_TEMP/routines-binaries/control" --candidate-binary "$RUNNER_TEMP/routines-binaries/candidate" \
            --daemon "$RUNNER_TEMP/routines-binaries/daemon" --daemon-revision "$DAEMON" \
            --lastdb-source "$GITHUB_WORKSPACE/engine" --records 256 --samples 20 \
            --output "$RUNNER_TEMP/routines-results/measurements"
      - name: Check the finite retained output before upload
        if: always()
        id: evidence
        run: python3 candidate/scripts/fleet-status-evidence.py "$RUNNER_TEMP/routines-results"
      - name: Retain source identities and actual operation results
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: routines-fleet-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routines-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the uploaded identity, expiry and archive checksum
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/routines-artifact-metadata.json"
          python3 engine/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/routines-artifact-metadata.json" --output "$RUNNER_TEMP/routines-artifact-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/routines-artifact.zip"
          printf '%s  %s\n' "${ARTIFACT_SHA256#sha256:}" "$RUNNER_TEMP/routines-artifact.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/routines-artifact.zip" > /dev/null
  benchmark-complete:
    if: ${{ always() }}
    needs: [compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require valid operations, balanced measurements and verified artifacts
        env:
          RESULT: ${{ needs.compare.result }}
        run: test "$RESULT" = success
