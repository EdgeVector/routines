name: Routines schema values and latency
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      schema_environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: routines-fleet-values-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Every arm runs on the latest prebuilt lastdb nightly (Tom, 2026-11-03): the comparison
  # that matters here is the old app against the new app on the latest LastDB.
  # Daemon-against-daemon comparisons belong in the lastdb benchmark CI.
  ROUTINES_SCHEMA_ENV: ${{ inputs.schema_environment || 'dev' }}
jobs:
  compare:
    name: Actual fleet commands, owned setup and latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_AFTER }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BEFORE }}
          path: control
          persist-credentials: false
      - name: Fetch the latest lastdb nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list -R EdgeVector/lastdb --exclude-drafts --limit 30 \
            --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag" && test "$tag" != null
          dir="$RUNNER_TEMP/lastdb-nightly"
          mkdir -p "$dir"
          gh release download "$tag" -R EdgeVector/lastdb -D "$dir" \
            -p 'lastdb-x86_64-unknown-linux-gnu.tar.gz' -p 'lastdb-x86_64-unknown-linux-gnu.manifest.json' -p SHA256SUMS.txt
          (cd "$dir" && grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          tar -xzf "$dir/lastdb-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
          for name in lastdb lastdbd; do
            want="$(jq -r --arg n "$name" '.binaries[] | select(.name == $n) | .sha256' "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
            test "$(sha256sum "$dir/$name" | cut -d' ' -f1)" = "$want"
          done
          oid="$(jq -r .source_git_oid "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
          sum="$(grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' "$dir/SHA256SUMS.txt" | cut -d' ' -f1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
          echo "lastdbd=$dir/lastdbd" >> "$GITHUB_OUTPUT"
          echo "lastdb=$dir/lastdb" >> "$GITHUB_OUTPUT"
          printf '### LastDB under test\n\nNightly `%s` (source `%s`), Linux tarball sha256 `%s`.\n' "$tag" "$oid" "$sum" >> "$GITHUB_STEP_SUMMARY"
      # The node, cleanup and artifact helpers come from the same source as the nightly daemon.
      - uses: actions/checkout@v4
        with:
          repository: EdgeVector/lastdb
          ref: ${{ steps.nightly.outputs.oid }}
          path: lastdb
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Pin the candidate and the PR-base control
        env:
          LASTDB_TAG: ${{ steps.nightly.outputs.tag }}
          LASTDB_OID: ${{ steps.nightly.outputs.oid }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$APP_AFTER"
          test "$(git -C control rev-parse HEAD)" = "$APP_BEFORE"
          test "$(git -C lastdb rev-parse HEAD)" = "$LASTDB_OID"
          mkdir -p "$RUNNER_TEMP/routines-results/source"
          printf 'Candidate %s\nPR base %s\nLastDB nightly %s\nLastDB source %s\n' \
            "$APP_AFTER" "$APP_BEFORE" "$LASTDB_TAG" "$LASTDB_OID" > "$RUNNER_TEMP/routines-results/source/revisions.txt"
      - name: Typecheck the candidate and the PR-base control
        run: |
          set -euo pipefail
          for label in control candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun install --frozen-lockfile
            bunx tsc --noEmit
          done
      - name: Build the actual app commands
        env:
          LASTDBD: ${{ steps.nightly.outputs.lastdbd }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/routines-binaries"
          for label in control candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun build src/cli.ts --compile --outfile "$RUNNER_TEMP/routines-binaries/$label"
          done
          cd "$RUNNER_TEMP/routines-binaries"
          sha256sum control candidate "$LASTDBD" > "$RUNNER_TEMP/routines-results/source/programs.sha256"
      - name: Compare actual commands in balanced orders on the latest nightly
        id: operations
        env:
          LASTDBD: ${{ steps.nightly.outputs.lastdbd }}
          LASTDB_OID: ${{ steps.nightly.outputs.oid }}
        run: |
          python3 candidate/scripts/fleet-status-latency.py --schema-environment "$ROUTINES_SCHEMA_ENV" \
            --candidate "$GITHUB_WORKSPACE/candidate" --candidate-revision "$APP_AFTER" \
            --control "$GITHUB_WORKSPACE/control" --control-revision "$APP_BEFORE" \
            --control-binary "$RUNNER_TEMP/routines-binaries/control" --candidate-binary "$RUNNER_TEMP/routines-binaries/candidate" \
            --daemon "$LASTDBD" --daemon-revision "$LASTDB_OID" \
            --lastdb-source "$GITHUB_WORKSPACE/lastdb" --records 256 --samples 20 \
            --output "$RUNNER_TEMP/routines-results/measurements"
      - name: Check the finite retained output before upload
        if: always()
        id: evidence
        run: python3 candidate/scripts/fleet-status-evidence.py "$RUNNER_TEMP/routines-results"
      - name: Retain source identities and actual operation results
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: routines-fleet-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routines-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the uploaded identity, expiry and archive checksum
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/routines-artifact-metadata.json"
          python3 lastdb/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/routines-artifact-metadata.json" --output "$RUNNER_TEMP/routines-artifact-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/routines-artifact.zip"
          printf '%s  %s\n' "${ARTIFACT_SHA256#sha256:}" "$RUNNER_TEMP/routines-artifact.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/routines-artifact.zip" > /dev/null
  benchmark-complete:
    if: ${{ always() }}
    needs: [compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require valid operations, balanced measurements and verified artifacts
        env:
          RESULT: ${{ needs.compare.result }}
        run: test "$RESULT" = success
